<!DOCTYPE html>
<html lang="zh-TW" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Japan Travel Guide | 日本景點探索誌</title>
  <meta name="description" content="精選日本熱門旅遊景點、私房秘境、主題分類與在地交通指引">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Tailwind 設定檔 -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            sakura: {
              50: '#fff5f7',
              100: '#ffe6ed',
              500: '#ff4d79',
              600: '#e62e5c',
            },
            japan: {
              red: '#bc002d',
              navy: '#0f2537',
            }
          }
        }
      }
    }
  </script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- 獨立 CSS 檔 -->
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 transition-colors duration-300 font-sans min-h-screen flex flex-col">

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 transition-all duration-300 bg-slate-900 text-white dark:bg-slate-100 dark:text-slate-900 px-4 py-3 rounded-xl shadow-2xl flex items-center gap-2 pointer-events-none">
    <i data-lucide="check-circle" class="w-5 h-5 text-emerald-400"></i>
    <span id="toast-msg" class="text-sm font-medium">已新增至收藏清單</span>
  </div>

  <!-- Navbar -->
  <nav class="sticky top-0 z-40 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 transition-colors">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <a href="#" class="flex items-center gap-2.5 group">
        <div class="w-9 h-9 rounded-full bg-japan-red flex items-center justify-center text-white font-bold text-lg shadow-md shadow-red-500/20">
          日
        </div>
        <span class="font-bold text-xl tracking-tight text-slate-900 dark:text-white">
          Japan<span class="text-sakura-500">Go</span>
        </span>
      </a>

      <!-- Desktop Nav Buttons -->
      <div class="hidden md:flex items-center gap-3">
        <button id="theme-toggle" class="p-2.5 rounded-full text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" title="切換深淺模式">
          <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
          <i data-lucide="moon" class="w-5 h-5 block dark:hidden"></i>
        </button>

        <button id="fav-open-btn" class="relative flex items-center gap-2 px-4 py-2 rounded-full bg-sakura-50 dark:bg-slate-800 text-sakura-600 dark:text-sakura-500 font-medium hover:bg-sakura-100 dark:hover:bg-slate-700 transition-all">
          <i data-lucide="heart" class="w-4 h-4 fill-current"></i>
          <span>我的收藏</span>
          <span id="fav-badge" class="bg-sakura-500 text-white text-xs px-2 py-0.5 rounded-full font-bold ml-0.5">0</span>
        </button>
      </div>

      <!-- Mobile Menu Button -->
      <div class="flex items-center gap-2 md:hidden">
        <button id="theme-toggle-mobile" class="p-2 rounded-lg text-slate-600 dark:text-slate-300">
          <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
          <i data-lucide="moon" class="w-5 h-5 block dark:hidden"></i>
        </button>
        <button id="fav-open-btn-mobile" class="relative p-2 text-sakura-500">
          <i data-lucide="heart" class="w-6 h-6 fill-current"></i>
          <span id="fav-badge-mobile" class="absolute top-1 right-1 bg-japan-red text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold">0</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- Hero Section -->
  <section class="relative bg-slate-900 text-white py-20 px-4 sm:px-6 lg:px-8 overflow-hidden">
    <div class="absolute inset-0 z-0 opacity-40 mix-blend-overlay">
      <img src="https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?auto=format&fit=crop&w=1920&q=80" alt="Japan background" class="w-full h-full object-cover">
    </div>
    <div class="absolute inset-0 bg-gradient-to-t from-slate-900 via-slate-900/40 to-transparent z-0"></div>

    <div class="relative z-10 max-w-4xl mx-auto text-center space-y-6">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white/10 backdrop-blur-md text-sakura-100 text-xs sm:text-sm font-medium border border-white/20">
        <i data-lucide="sparkles" class="w-4 h-4 text-sakura-500"></i>
        探索四季之美 · 規劃完美日本行程
      </div>
      <h1 class="text-3xl sm:text-5xl lg:text-6xl font-extrabold tracking-tight leading-tight">
        發現屬於你的<span class="text-transparent bg-clip-text bg-gradient-to-r from-sakura-500 to-rose-300">日本浪漫之旅</span>
      </h1>
      <p class="text-slate-300 text-base sm:text-lg max-w-2xl mx-auto">
        從繁華的東京街頭到京都的古意神社，精選熱門景點與在地秘境，輕鬆開啟你的日本行。
      </p>

      <!-- Global Search Bar -->
      <div class="pt-4 max-w-2xl mx-auto">
        <div class="relative flex items-center">
          <i data-lucide="search" class="absolute left-4 w-5 h-5 text-slate-400"></i>
          <input type="text" id="search-input" placeholder="搜尋景點名稱、城市或關鍵字 (例如：富士山、清水寺)..." class="w-full pl-12 pr-10 py-3.5 bg-white/95 dark:bg-slate-800/95 backdrop-blur-md rounded-2xl text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-sakura-500 shadow-xl transition-all text-sm sm:text-base">
          <button id="clear-search" class="absolute right-3 p-1 rounded-full text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hidden">
            <i data-lucide="x" class="w-4 h-4"></i>
          </button>
        </div>
      </div>
    </div>
  </section>

  <!-- Main Content Area -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 flex-grow w-full">
    
    <!-- Filter Controls -->
    <div class="space-y-6 mb-8">
      <!-- Region Chips -->
      <div>
        <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">地區探索 (Region)</h3>
        <div class="flex items-center gap-2 overflow-x-auto pb-2 hide-scrollbar" id="region-filters">
          <!-- Populated by JS -->
        </div>
      </div>

      <!-- Category Chips -->
      <div>
        <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">主題分類 (Category)</h3>
        <div class="flex items-center gap-2 overflow-x-auto pb-2 hide-scrollbar" id="category-filters">
          <!-- Populated by JS -->
        </div>
      </div>
    </div>

    <!-- Active Filters & Result Count Bar -->
    <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between pb-4 mb-6 border-b border-slate-200 dark:border-slate-800 gap-2">
      <div class="text-sm text-slate-500 dark:text-slate-400">
        共找到 <span id="spot-count" class="font-bold text-sakura-600 dark:text-sakura-500">0</span> 個景點
      </div>
      <button id="reset-filters-btn" class="text-xs text-slate-500 hover:text-sakura-500 flex items-center gap-1 transition-colors hidden">
        <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
        重設所有篩選
      </button>
    </div>

    <!-- Spot Grid -->
    <div id="spot-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 sm:gap-8">
      <!-- Spot Cards rendered via JS -->
    </div>

    <!-- Empty State -->
    <div id="empty-state" class="hidden text-center py-16 space-y-4">
      <div class="w-16 h-16 bg-slate-100 dark:bg-slate-800 rounded-full flex items-center justify-center mx-auto text-slate-400">
        <i data-lucide="map-pin-off" class="w-8 h-8"></i>
      </div>
      <h3 class="text-lg font-bold text-slate-800 dark:text-slate-200">未找到符合條件的景點</h3>
      <p class="text-slate-500 dark:text-slate-400 text-sm max-w-sm mx-auto">請嘗試調整搜尋關鍵字或清除地區/分類篩選條件。</p>
      <button id="empty-reset-btn" class="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-sakura-500 text-white text-sm font-medium hover:bg-sakura-600 transition-colors">
        重設篩選
      </button>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 py-8 transition-colors">
    <div class="max-w-7xl mx-auto px-4 text-center space-y-3">
      <div class="flex justify-center items-center gap-2 text-slate-900 dark:text-white font-bold text-lg">
        <div class="w-6 h-6 rounded-full bg-japan-red text-white flex items-center justify-center text-xs">日</div>
        JapanGo 景點誌
      </div>
      <p class="text-xs text-slate-500 dark:text-slate-400">
        © 2026 JapanGo. Designed for GitHub Pages.
      </p>
    </div>
  </footer>

  <!-- Detail Modal -->
  <div id="modal-backdrop" class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
    <div id="modal-card" class="bg-white dark:bg-slate-900 w-full max-w-2xl max-h-[90vh] rounded-3xl overflow-hidden shadow-2xl border border-slate-200 dark:border-slate-800 transform scale-95 transition-transform duration-300 flex flex-col">
      <!-- Modal Header Image -->
      <div class="relative h-64 sm:h-80 w-full flex-shrink-0">
        <img id="modal-img" src="" alt="" class="w-full h-full object-cover">
        <div class="absolute inset-0 bg-gradient-to-t from-slate-950/80 via-transparent to-transparent"></div>
        <button id="modal-close-btn" class="absolute top-4 right-4 p-2 rounded-full bg-slate-900/60 text-white hover:bg-slate-900 transition-colors backdrop-blur-md">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
        <div class="absolute bottom-4 left-6 right-6 text-white space-y-1">
          <div class="flex items-center justify-between">
            <span id="modal-region" class="px-2.5 py-0.5 rounded-md bg-sakura-500 text-xs font-semibold uppercase tracking-wider"></span>
            <div class="flex items-center gap-1 text-amber-400 font-bold text-sm bg-slate-900/60 backdrop-blur-md px-2.5 py-1 rounded-full">
              <i data-lucide="star" class="w-4 h-4 fill-current"></i>
              <span id="modal-rating"></span>
            </div>
          </div>
          <h2 id="modal-title" class="text-2xl sm:text-3xl font-extrabold"></h2>
          <p id="modal-jpname" class="text-slate-300 text-sm font-medium"></p>
        </div>
      </div>

      <!-- Modal Body -->
      <div class="p-6 overflow-y-auto space-y-6 flex-grow">
        <!-- Tags -->
        <div class="flex flex-wrap gap-2" id="modal-tags"></div>

        <!-- Description -->
        <div>
          <h4 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">景點簡介</h4>
          <p id="modal-desc" class="text-slate-600 dark:text-slate-300 text-sm sm:text-base leading-relaxed"></p>
        </div>

        <!-- Info Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 bg-slate-50 dark:bg-slate-800/50 p-4 rounded-2xl border border-slate-100 dark:border-slate-800 text-xs sm:text-sm">
          <div class="flex items-start gap-2.5">
            <i data-lucide="clock" class="w-4 h-4 text-sakura-500 mt-0.5 flex-shrink-0"></i>
            <div>
              <span class="block font-semibold text-slate-700 dark:text-slate-200">開放時間</span>
              <span id="modal-hours" class="text-slate-500 dark:text-slate-400"></span>
            </div>
          </div>
          <div class="flex items-start gap-2.5">
            <i data-lucide="sun-medium" class="w-4 h-4 text-amber-500 mt-0.5 flex-shrink-0"></i>
            <div>
              <span class="block font-semibold text-slate-700 dark:text-slate-200">最佳造訪季節</span>
              <span id="modal-season" class="text-slate-500 dark:text-slate-400"></span>
            </div>
          </div>
          <div class="flex items-start gap-2.5 sm:col-span-2">
            <i data-lucide="bus" class="w-4 h-4 text-indigo-500 mt-0.5 flex-shrink-0"></i>
            <div>
              <span class="block font-semibold text-slate-700 dark:text-slate-200">交通指引</span>
              <span id="modal-access" class="text-slate-500 dark:text-slate-400"></span>
            </div>
          </div>
        </div>
      </div>

      <!-- Modal Footer -->
      <div class="p-4 bg-slate-50 dark:bg-slate-800/80 border-t border-slate-200 dark:border-slate-800 flex items-center justify-between gap-3">
        <button id="modal-fav-btn" class="flex-1 flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 font-semibold text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors text-sm">
          <i data-lucide="heart" class="w-4 h-4"></i>
          <span id="modal-fav-text">加入收藏</span>
        </button>
        <a id="modal-map-link" href="#" target="_blank" rel="noopener noreferrer" class="flex-1 flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl bg-sakura-500 hover:bg-sakura-600 text-white font-semibold shadow-md transition-colors text-sm">
          <i data-lucide="map-pin" class="w-4 h-4"></i>
          <span>Google 地圖</span>
        </a>
      </div>
    </div>
  </div>

  <!-- Favorites Drawer -->
  <div id="drawer-backdrop" class="fixed inset-0 bg-slate-950/50 backdrop-blur-xs z-50 opacity-0 pointer-events-none transition-opacity duration-300">
    <div id="drawer" class="fixed top-0 right-0 h-full w-full max-w-md bg-white dark:bg-slate-900 shadow-2xl transform translate-x-full transition-transform duration-300 flex flex-col border-l border-slate-200 dark:border-slate-800">
      <div class="p-4 sm:p-6 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <i data-lucide="heart" class="w-5 h-5 text-sakura-500 fill-current"></i>
          <h2 class="font-bold text-lg text-slate-900 dark:text-white">我的景點收藏</h2>
        </div>
        <button id="drawer-close-btn" class="p-2 rounded-full text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Drawer Content -->
      <div id="drawer-list" class="flex-grow overflow-y-auto p-4 sm:p-6 space-y-4">
        <!-- Rendered by JS -->
      </div>

      <!-- Drawer Footer -->
      <div class="p-4 border-t border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/50">
        <button id="clear-favs-btn" class="w-full py-2.5 rounded-xl text-xs text-rose-500 border border-rose-200 dark:border-rose-900/50 hover:bg-rose-50 dark:hover:bg-rose-950/30 font-medium transition-colors">
          清空所有收藏
        </button>
      </div>
    </div>
  </div>

  <!-- 獨立 JS 檔 -->
  <script src="script.js"></script>
</body>
</html>
